name: prepare
description: Installs Node.js, pnpm and the dependencies, then emsdk, then builds the packages
runs:
  using: composite
  steps:
    - name: Set up Node.js, pnpm and the dependencies
      uses: nanoforge-dev/actions/setup@v3

    - name: Install emsdk
      uses: ./.github/actions/emsdk-install

    - name: Build packages
      shell: bash
      run: pnpm run build
