name: Alpha Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "The published name of a single package to release"
        type: choice
        required: true
        options:
          - "@nanoforge-dev/asset"
          - "@nanoforge-dev/common"
          - "@nanoforge-dev/core"
          - "@nanoforge-dev/ecs"
          - "@nanoforge-dev/editor-lib"
          - "@nanoforge-dev/env"
          - "@nanoforge-dev/graphics-2d"
          - "@nanoforge-dev/input"
          - "@nanoforge-dev/music"
          - "@nanoforge-dev/network"
          - "@nanoforge-dev/sound"
          - "@nanoforge-dev/utils-eslint-config"
          - "@nanoforge-dev/utils-prettier-config"
      dry_run:
        description: Perform a dry run?
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  alpha-release:
    name: Alpha release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Release alpha
        uses: ./node_modules/@nanoforge-dev/actions/actions/release-dev
        with:
          package: ${{ inputs.package }}
          tag: alpha
          dry: ${{ inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
