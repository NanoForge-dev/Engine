name: Release
# The release PR title holds the versions (commitFormat); other merged PRs release nothing (no betaOnMerge group).
run-name: >-
  ${{ !github.event.pull_request.merged && format('Closed without merge: {0}', github.event.pull_request.title)
  || startsWith(github.head_ref, 'releases/') && format('Release: {0}', github.event.pull_request.title)
  || format('No release: {0}', github.event.pull_request.title) }}

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    uses: nanoforge-dev/actions/.github/workflows/release.yml@v3
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      # The config has docs: the engine group's releases sync them into NanoForge-dev/docs.
      NANOFORGE_DOCS_PRIVATE_KEY: ${{ secrets.NANOFORGE_DOCS_PRIVATE_KEY }}
