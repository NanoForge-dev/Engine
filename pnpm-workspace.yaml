packages:
  - packages/*
  - modules/*
  - utils/*
  - e2e/game/**
  - e2e/game-2d/**
  - e2e/game-3d/**
  - example/**

allowBuilds:
  bun: true

publicHoistPattern:
  - '@node-datachannel/*'

catalogs:
  build:
    tsdown: ^0.22.14
    unrun: ^0.3.0
  ci:
    '@commitlint/cli': ^21.2.2
    '@commitlint/config-conventional': ^21.2.2
    '@favware/cliff-jumper': ^6.0.0
    husky: ^9.1.7
    lint-staged: ^17.4.1
  config:
    '@nanoforge-dev/config': ^2.3.0
  core:
    '@types/bun': ^1.4.2
    '@types/node': ^26.4.0
    turbo: ^2.11.10
    typescript: ^6.0.3
  docs:
    typedoc: ^0.28.19
    typedoc-plugin-markdown: ^4.11.0
  env:
    class-transformer: ^0.5.1
    class-validator: ^0.14.3
  graphics:
    '@types/three': ^0.187.0
    konva: ^10.2.3
    three: ^0.187.0
  lint:
    '@eslint/js': ^10.0.1
    '@trivago/prettier-plugin-sort-imports': ^6.0.2
    eslint: ^10.9.1
    eslint-config-prettier: ^10.1.8
    eslint-formatter-pretty: ^7.1.0
    eslint-plugin-format: ^2.0.1
    eslint-plugin-prettier: ^5.5.5
    globals: ^17.3.0
    prettier: ^3.9.6
    typescript-eslint: ^8.61.0
  network:
    node-datachannel: ^0.33.4
  test:
    '@playwright/test': 1.64.1
    '@vitest/coverage-v8': ^4.1.11
    vitest: ^4.1.11

minimumReleaseAgeExclude:
  - '@nanoforge-dev/config@2.3.0'
  - '@nanoforge-dev/cli@2.3.0'
  - '@nanoforge-dev/loader-client@1.5.1'
  - '@nanoforge-dev/loader-server@1.5.1'
  - '@nanoforge-dev/loader-website@1.5.1'
  - '@nanoforge-dev/schematics@2.3.0'
